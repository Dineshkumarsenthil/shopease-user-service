services:
  user-db:
    image: mysql:8.0
    container_name: shopease-user-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"          # host 3308 -> container 3306 (Auth service uses 3307)
    volumes:
      - user_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    build: .
    container_name: shopease-user-container
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      MYSQL_HOST: user-db      # Compose service name, NOT localhost
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"

volumes:
  user_db_data:
